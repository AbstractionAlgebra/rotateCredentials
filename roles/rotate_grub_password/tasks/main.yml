---
- name: Rotate GRUB password
  block:
    - name: Detect EFI firmware
      ansible.builtin.stat:
        path: /sys/firmware/efi
      register: grub_efi_firmware

    - name: Determine GRUB password rotation commands and files
      ansible.builtin.set_fact:
        grub_password_hash_command: >-
          {{
            'grub2-mkpasswd-pbkdf2'
            if ansible_facts.os_family == 'RedHat'
            else 'grub-mkpasswd-pbkdf2'
          }}
        grub_auth_file: /etc/grub.d/01_users
        grub_config_file: >-
          {{ '/boot/efi/EFI/redhat/grub.cfg'
             if ansible_facts.os_family == 'RedHat' and
                ansible_facts.distribution_major_version == '8' and
                grub_efi_firmware.stat.exists
             else '/boot/grub2/grub.cfg' }}

    - name: Determine GRUB regeneration command
      ansible.builtin.set_fact:
        grub_regenerate_command: >-
          {{
            'grub2-mkconfig -o ' ~ grub_config_file
            if ansible_facts.os_family == 'RedHat'
            else 'update-grub'
          }}

    - name: Generate GRUB PBKDF2 password hash
      ansible.builtin.command:
        cmd: "{{ grub_password_hash_command }}"
        stdin: "{{ grub_credential.new }}\n{{ grub_credential.new }}\n"
      changed_when: false
      register: grub_password_hash_output
      no_log: true

    - name: Extract GRUB PBKDF2 password hash
      ansible.builtin.set_fact:
        grub_password_hash: >-
          {{
            grub_password_hash_output.stdout |
            regex_search('grub\\.pbkdf2\\.sha512\\.[^\\s]+')
          }}
      no_log: true

    - name: Validate GRUB PBKDF2 password hash was generated
      ansible.builtin.assert:
        that:
          - grub_password_hash is defined
          - grub_password_hash | length > 0
        fail_msg: >-
          GRUB password hash generation did not return a PBKDF2 SHA-512 hash.
      no_log: true

    - name: Ensure GRUB authentication script exists
      ansible.builtin.copy:
        dest: "{{ grub_auth_file }}"
        owner: root
        group: root
        mode: "0700"
        content: |
          #!/bin/sh -e
        force: false

    - name: Manage GRUB authentication block
      ansible.builtin.blockinfile:
        path: "{{ grub_auth_file }}"
        owner: root
        group: root
        mode: "0700"
        marker: "# {mark} ANSIBLE MANAGED GRUB AUTH BLOCK"
        block: |
          cat <<'EOF'
          set superusers="root"
          password_pbkdf2 root {{ grub_password_hash }}
          EOF
      no_log: true

    - name: Regenerate GRUB configuration
      ansible.builtin.command:
        cmd: "{{ grub_regenerate_command }}"
      changed_when: true
      no_log: true

    - name: Record GRUB password rotation success
      ansible.builtin.set_fact:
        rotation_successes: >-
          {{
            rotation_successes +
            [
              'GRUB password rotated and boot configuration regenerated using ' ~
              grub_auth_file
            ]
          }}

  rescue:
    - name: Record GRUB password rotation failure
      ansible.builtin.set_fact:
        rotation_failures: >-
          {{
            rotation_failures +
            [
              'GRUB password rotation failed during task: ' ~
              (ansible_failed_task.name | default('unknown GRUB password task')) ~
              '. Suggested action: verify the GRUB password utility, ' ~
              '/etc/grub.d permissions, and boot configuration regeneration ' ~
              'command on the host, then rerun the GRUB rotation.'
            ]
          }}
